services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override host-local Qdrant URL for in-compose networking.
      QDRANT_URL: http://qdrant:6333
      KEYWORD_INDEX_PATH: /app/data/keyword_index/index.json
    volumes:
      - keyword_index_data:/app/data/keyword_index
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  qdrant_storage:
  keyword_index_data:
